<!--
  pdf.js core + worker are vendored locally (not loaded from a CDN) so the
  viewer keeps working behind school firewalls/CSPs that block third-party
  scripts. `pdf.min.mjs` / `pdf.worker.min.mjs` in this directory are copied
  verbatim from `node_modules/pdfjs-dist/build/`; re-copy both files whenever
  the `pdfjs-dist` dependency in package.json is bumped, since the worker and
  core builds must always be from the exact same version.
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF</title>
    <style>
      html, body { margin: 0; padding: 0; background: transparent; height: 100%; }
      #root { height: 100%; overflow: auto; padding: 10px; user-select: none; }
      .page { margin: 0 0 12px 0; }
      canvas { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: #fff; }
      #wm {
        pointer-events: none;
        position: fixed;
        inset: 0;
        user-select: none;
        background-repeat: repeat;
        z-index: 5;
      }
      #err { padding: 12px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; font-size: 13px; color: rgba(255,255,255,0.9); }
      #busy { padding: 12px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; font-size: 13px; color: rgba(255,255,255,0.7); }
      @media print {
        html, body { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="wm"></div>

    <script type="module">
      const root = document.getElementById("root");
      const wm = document.getElementById("wm");

      function setErr(msg) {
        root.innerHTML = "";
        const d = document.createElement("div");
        d.id = "err";
        d.textContent = msg;
        root.appendChild(d);
      }

      function setBusy(msg) {
        root.innerHTML = "";
        const d = document.createElement("div");
        d.id = "busy";
        d.textContent = msg;
        root.appendChild(d);
      }

      window.addEventListener("contextmenu", (e) => e.preventDefault());

      let pdfjs = null;

      async function ensurePdfJs() {
        if (pdfjs) return pdfjs;
        // Relative to this document's own (unprefixed) URL -- resolves
        // through the same static-asset proxy rewrite as this HTML file.
        pdfjs = await import("./pdf.min.mjs");
        pdfjs.GlobalWorkerOptions.workerSrc = "./pdf.worker.min.mjs";
        return pdfjs;
      }

      function escapeXml(text) {
        return String(text).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
      }

      // Renders the watermark text into a small rotated SVG tile and repeats
      // it as a CSS background, producing a diagonal grid that covers the
      // whole viewport instead of a single easy-to-crop-out watermark.
      function applyWatermark(text) {
        const label = String(text || "").trim();
        if (!label) {
          wm.style.backgroundImage = "none";
          return;
        }
        const w = 360;
        const h = 190;
        const svg =
          `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">` +
          `<text x="${w / 2}" y="${h / 2}" transform="rotate(-24 ${w / 2} ${h / 2})" ` +
          `text-anchor="middle" dominant-baseline="middle" ` +
          `font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="13" font-weight="700" ` +
          `fill="rgba(255,255,255,0.5)">${escapeXml(label)}</text></svg>`;
        wm.style.backgroundImage = `url("data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(svg)))}")`;
      }

      let pageObserver = null;
      let lastReportedPage = null;
      let reportTimer = null;

      function reportPage(page) {
        if (page === lastReportedPage) return;
        lastReportedPage = page;

        clearTimeout(reportTimer);
        reportTimer = setTimeout(() => {
          try {
            window.parent.postMessage({ type: "PDF_PAGE", page }, "*");
          } catch {}
        }, 400);
      }

      function observePages() {
        if (pageObserver) pageObserver.disconnect();

        pageObserver = new IntersectionObserver(
          (entries) => {
            let best = null;

            for (const entry of entries) {
              if (!best || entry.intersectionRatio > best.intersectionRatio) {
                best = entry;
              }
            }

            if (best && best.intersectionRatio > 0.5) {
              reportPage(Number(best.target.dataset.page));
            }
          },
          { root, threshold: [0, 0.25, 0.5, 0.75, 1] }
        );

        root.querySelectorAll(".page").forEach((el) => pageObserver.observe(el));
      }

      async function renderPdf(url, scale, initialPage) {
        setBusy("Загрузка PDF…");

        const pdf = await ensurePdfJs();

        const task = pdf.getDocument({ url });
        const doc = await task.promise;

        root.innerHTML = "";
        lastReportedPage = null;

        let initialWrap = null;

        for (let i = 1; i <= doc.numPages; i++) {
          const page = await doc.getPage(i);
          const viewport = page.getViewport({ scale });

          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);

          const wrap = document.createElement("div");
          wrap.className = "page";
          wrap.dataset.page = String(i);
          wrap.appendChild(canvas);
          root.appendChild(wrap);

          if (i === initialPage) initialWrap = wrap;

          await page.render({ canvasContext: ctx, viewport }).promise;
        }

        observePages();

        if (initialWrap) {
          initialWrap.scrollIntoView({ block: "start" });
        }
      }

      window.addEventListener("message", async (ev) => {
        const data = ev.data || {};
        if (data.type !== "PDF_LOAD") return;

        try {
          const { signedUrl, watermark, scale, initialPage } = data;
          applyWatermark(watermark);
          await renderPdf(
            signedUrl,
            typeof scale === "number" ? scale : 1.35,
            typeof initialPage === "number" && initialPage > 1 ? initialPage : undefined
          );
        } catch (e) {
          setErr(String(e?.message || e));
        }
      });

      // Announce readiness only once the PDF_LOAD listener above is actually
      // registered, so the parent never sends PDF_LOAD into a sandbox that
      // isn't listening yet.
      try {
        window.parent.postMessage({ type: "SANDBOX_READY" }, "*");
      } catch {}
    </script>
  </body>
</html>
